name: Update Twitter Trends

on:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分钟运行一次
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch Trends
        env:
          API_KEY: ${{ secrets.TWITTER_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const locations = { global: 1, thailand: 23424960, singapore: 23424948 };

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchTrends() {
            const result = { lastUpdated: Date.now() };
            
            for (const [name, woeid] of Object.entries(locations)) {
              try {
                const res = await fetch(`https://api.twitterapi.io/twitter/trends?woeid=${woeid}`, {
                  headers: { 'X-API-Key': process.env.API_KEY }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                
                let trendArray = [];
                if (Array.isArray(data)) {
                  trendArray = data[0]?.trends || data;
                } else if (data.trends) {
                  trendArray = data.trends;
                } else if (data.data && data.data.trends) {
                  trendArray = data.data.trends;
                }

                // 深层解析，强制将 name 转换为字符串，防止前端崩溃
                result[name] = trendArray.slice(0, 50).map(t => {
                  let realName = '';
                  let realRank = 0;

                  let rawName = t.name || t.trend || t.query || '';
                  if (typeof rawName === 'object' && rawName !== null) {
                    realName = rawName.name || (rawName.target && rawName.target.query) || '';
                    realRank = rawName.rank || 0;
                  } else {
                    realName = String(rawName);
                    realRank = t.rank || t.position || 0;
                  }

                  return { rank: realRank, name: realName };
                }).filter(t => t.name !== '');

                console.log(`[${name}] 成功解析了 ${result[name].length} 条趋势`);
              } catch (e) {
                console.error(`Fetch ${name} failed:`, e.message);
                result[name] = []; 
              }
              
              if (name !== 'singapore') {
                console.log(`等待 5.5 秒后继续...`);
                await sleep(5500); 
              }
            }
            
            fs.writeFileSync('trends.json', JSON.stringify(result, null, 2));
            console.log('trends.json 生成完毕');
          }
          fetchTrends();
          EOF

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Auto-update trends [skip ci]'
          file_pattern: trends.json
          commit_user_name: 'GitHub Action Bot'
          commit_user_email: 'action@github.com'
