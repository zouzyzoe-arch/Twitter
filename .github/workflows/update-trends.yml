name: Update Twitter Trends

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch Trends
        env:
          API_KEY: ${{ secrets.TWITTER_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          
          // 1. 检查开关文件
          try {
            const switchData = JSON.parse(fs.readFileSync('trend_switch.json', 'utf8'));
            if (!switchData.enabled) {
              console.log('⏸️ 实时查询已在后台关闭，本次跳过执行。');
              process.exit(0); 
            }
          } catch (e) {
            console.log('未找到 trend_switch.json，默认继续执行');
          }

          const locations = { thailand: 23424960, singapore: 23424948 };
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchTrends() {
            // 【新增】读取旧的 trends.json，用于保留最高排名
            let oldData = { thailand: [], singapore: [] };
            if (fs.existsSync('trends.json')) {
              try {
                oldData = JSON.parse(fs.readFileSync('trends.json', 'utf8'));
              } catch (e) {}
            }
            
            const result = { lastUpdated: Date.now() };
            
            for (const [name, woeid] of Object.entries(locations)) {
              try {
                const res = await fetch(`https://api.twitterapi.io/twitter/trends?woeid=${woeid}`, {
                  headers: { 'X-API-Key': process.env.API_KEY }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                
                let trendArray = [];
                if (Array.isArray(data)) trendArray = data[0]?.trends || data;
                else if (data.trends) trendArray = data.trends;
                else if (data.data && data.data.trends) trendArray = data.data.trends;

                const newTrends = trendArray.slice(0, 30).map(t => {
                  let realName = '', realRank = 0;
                  let rawName = t.name || t.trend || t.query || '';
                  if (typeof rawName === 'object' && rawName !== null) {
                    realName = rawName.name || (rawName.target && rawName.target.query) || '';
                    realRank = rawName.rank || 0;
                  } else {
                    realName = String(rawName); realRank = t.rank || t.position || 0;
                  }
                  return { rank: realRank, name: realName };
                }).filter(t => t.name !== '');

                // 【新增】合并旧数据：将未上榜但曾经上榜的词条，以历史最高排名保留在列表中
                const oldTrends = oldData[name] || [];
                
                // 1. 找出所有曾经出现过的词条名
                const allNames = new Set([...newTrends.map(t => t.name), ...oldTrends.map(t => t.name)]);
                
                result[name] = Array.from(allNames).map(tName => {
                  const newMatch = newTrends.find(t => t.name === tName);
                  const oldMatch = oldTrends.find(t => t.name === tName);
                  
                  if (newMatch && oldMatch) {
                    // 如果新旧都有，取最好（数值最小）的排名
                    return { rank: Math.min(newMatch.rank, oldMatch.rank), name: tName };
                  } else if (newMatch) {
                    return newMatch;
                  } else {
                    // 如果只有旧的，说明掉榜了，保留其历史最高记录，但为了区分，我们不改rank，前端判断
                    return oldMatch;
                  }
                });

                // 重新按排名排序
                result[name].sort((a, b) => a.rank - b.rank);

              } catch (e) {
                console.error(`Fetch ${name} failed:`, e.message);
                result[name] = oldData[name] || []; // 失败则保留旧数据
              }
              if (name !== 'singapore') await sleep(5500); 
            }
            
            fs.writeFileSync('trends.json', JSON.stringify(result, null, 2));
            console.log('trends.json 生成完毕（已包含历史最高排名）');
          }
          fetchTrends();
          EOF

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Auto-update trends [skip ci]'
          file_pattern: trends.json
          commit_user_name: 'GitHub Action Bot'
          commit_email: 'action@github.com'
