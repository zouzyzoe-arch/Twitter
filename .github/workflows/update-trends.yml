name: Update Twitter Trends

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Trends
        env:
          API_KEY: ${{ secrets.TWITTER_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const locations = { global: 1, thailand: 23424960, singapore: 23424948 };

          async function fetchTrends() {
            const result = {};
            for (const [name, woeid] of Object.entries(locations)) {
              try {
                const res = await fetch(`https://api.twitterapi.io/twitter/trends?woeid=${woeid}`, {
                  headers: { 'X-API-Key': process.env.API_KEY }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                
                const rawTrends = data.trends || data.data?.trends || data.data || [];
                const trends = Array.isArray(rawTrends) ? rawTrends : [];

                result[name] = trends.slice(0, 50).map((t, index) => ({
                  rank: t.rank || index + 1,
                  name: t.name || t.trend || t.query || t.hashtag || ''
                })).filter(t => t.name !== '');
                
              } catch (e) {
                console.error(`Fetch ${name} failed:`, e.message);
                result[name] = [];
              }
            }
            fs.writeFileSync('trends.json', JSON.stringify(result, null, 2));
          }
          fetchTrends();
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add trends.json
          git commit -m "Auto-update trends [skip ci]" || echo "No changes to commit"
          git pull origin main --rebase
          git push
